name: iOS Manifest Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: manifest-sync
  cancel-in-progress: false

env:
  UPSTREAM_MANIFEST: "http://app.ioskuka.com/appstore/manifest.plist"
  PAGES_BASE_URL: "https://<username>.github.io/<repo>"
  REWRITE_MODE: "proxy"
  PROXY_BASE_URL: "https://ipa-proxy.example.com"
  VERIFY_LINKS: "true"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Run manifest sync
        env:
          UPSTREAM_MANIFEST: ${{ env.UPSTREAM_MANIFEST }}
          PAGES_BASE_URL: ${{ env.PAGES_BASE_URL }}
          REWRITE_MODE: ${{ env.REWRITE_MODE }}
          PROXY_BASE_URL: ${{ env.PROXY_BASE_URL }}
          VERIFY_LINKS: ${{ env.VERIFY_LINKS }}
        run: python sync.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(sync): refresh manifest.plist [skip ci]"
          commit_user_name: "manifest-sync-bot"
          commit_user_email: "manifest-sync-bot@users.noreply.github.com"
          file_pattern: "manifest.plist apps.json"

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4